<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM IA Soluções - Início</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ff8c00; /* Laranja Osure */
            margin-bottom: 10px;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background-color: #ff8c00;
            color: #121212;
            text-decoration: none;
            padding: 12px 20px;
            margin: 10px 0;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #e67e00;
        }
        .btn-outline {
            background-color: transparent;
            color: #ff8c00;
            border: 2px solid #ff8c00;
        }
        .btn-outline:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRM IA Soluções</h1>
        <p>Plataforma de gestão inteligente. Centralize seus clientes e otimize suas operações com alta performance.</p>
        
        <a href="/login" class="btn">Entrar no Sistema</a>
        <a href="/registro" class="btn btn-outline">Criar uma Conta</a>
    </div>
</body>
</html>
